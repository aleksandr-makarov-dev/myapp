<svg xmlns="http://www.w3.org/2000/svg" width="900" height="638" viewBox="0 0 900 638" role="img" aria-labelledby="title desc">
<title id="title">Preesens: настоящее и будущее</title>
<desc id="desc">Цветная шкала: прошлое, сейчас и будущее. Preesens охватывает настоящее и будущее. Примеры Asun nyt Suomessa, Asun ensi vuonna Suomessa, Syön omenaa и Syön omenan.</desc>
<defs>
  <linearGradient id="perfect" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#94d9f5"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#17232e"/>
  </marker>
</defs>
<rect width="900" height="638" rx="16" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<rect x="24" y="20" width="266" height="82" rx="0" fill="#fb4963"/>
<rect x="290" y="20" width="292" height="82" rx="0" fill="#ffb43b"/>
<rect x="582" y="20" width="294" height="82" rx="0" fill="#ffe64a"/>
<text x="157" y="53" font-size="27" font-weight="700" fill="#17232e" text-anchor="middle">menneisyys</text>
<text x="157" y="82" font-size="21" font-weight="400" fill="#17232e" text-anchor="middle">прошлое</text>
<text x="436" y="53" font-size="27" font-weight="700" fill="#17232e" text-anchor="middle">nykyhetki</text>
<text x="436" y="82" font-size="21" font-weight="400" fill="#17232e" text-anchor="middle">сейчас</text>
<text x="729" y="53" font-size="27" font-weight="700" fill="#17232e" text-anchor="middle">tulevaisuus</text>
<text x="729" y="82" font-size="21" font-weight="400" fill="#17232e" text-anchor="middle">будущее</text>
<line x1="290" y1="112" x2="290" y2="198" stroke="#66737d" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 8"/>
<polygon points="290,126 852,126 876,154.0 852,182 290,182" fill="#36bff0" stroke="#17232e" stroke-width="2" stroke-linejoin="round"/>
<text x="577.0" y="162.5" font-size="25" font-weight="700" fill="#17232e" text-anchor="middle">Preesens · настоящее и будущее</text>
<rect x="24" y="212" width="852" height="190" rx="12" fill="#f5f7fa"/>
<rect x="24" y="212" width="6" height="190" rx="0" fill="#ffb43b"/>
<text x="48" y="249" font-size="23" font-weight="700" fill="#17232e" text-anchor="start">СЕЙЧАС</text>
<text x="48" y="296" font-size="30" font-weight="400" fill="#17232e" text-anchor="start">Asun nyt Suomessa.</text>
<text x="48" y="341" font-size="30" font-weight="400" fill="#17232e" text-anchor="start">Syön omenaa.</text>
<text x="48" y="381" font-size="22" font-weight="400" fill="#40505f" text-anchor="start">I live in Finland now. I am eating an apple.</text>
<rect x="24" y="424" width="852" height="190" rx="12" fill="#f5f7fa"/>
<rect x="24" y="424" width="6" height="190" rx="0" fill="#ffe64a"/>
<text x="48" y="461" font-size="23" font-weight="700" fill="#17232e" text-anchor="start">БУДУЩЕЕ</text>
<text x="48" y="508" font-size="30" font-weight="400" fill="#17232e" text-anchor="start">Asun ensi vuonna Suomessa.</text>
<text x="48" y="553" font-size="30" font-weight="400" fill="#17232e" text-anchor="start">Syön omenan.</text>
<text x="48" y="593" font-size="22" font-weight="400" fill="#40505f" text-anchor="start">I will live in Finland next year. I will eat the whole apple.</text>
