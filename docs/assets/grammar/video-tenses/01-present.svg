<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
<title id="title">Preesens: настоящее и будущее</title>
<desc id="desc">Одна форма asun относится к настоящему или будущему. Nyt означает now, ensi vuonna — next year.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="245" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="165" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Menneisyys · past</text>
<text x="400" y="32" font-size="17" font-weight="700" fill="#17232e" text-anchor="middle">Nyt · now</text>
<text x="655" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Tulevaisuus · future</text>
<line x1="40" y1="78" x2="400" y2="78" stroke="#fb4963" stroke-width="5" stroke-linecap="round"/>
<line x1="400" y1="78" x2="760" y2="78" stroke="#ffe64a" stroke-width="5" stroke-linecap="round"/>
<circle cx="400" cy="78" r="9" fill="#ffb43b"/>
<line x1="400" y1="125" x2="750" y2="125" stroke="#159fd2" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="575" y="112" font-size="19" font-weight="700" fill="#17232e" text-anchor="middle">Preesens</text>
<line x1="400" y1="91" x2="400" y2="151" stroke="#ffb43b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
<circle cx="665" cy="78" r="6" fill="#ffe64a"/>
<line x1="665" y1="90" x2="665" y2="151" stroke="#ffe64a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="386" y="191" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Asun nyt Suomessa.</text>
<text x="650" y="191" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Asun ensi vuonna</text>
<text x="650" y="220" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Suomessa.</text>
</g>
</svg>
