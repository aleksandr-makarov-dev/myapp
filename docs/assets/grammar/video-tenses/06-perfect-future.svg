<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
<title id="title">Perfekti перед будущим действием</title>
<desc id="desc">После настоящего момента: сначала завершение домашнего задания (1), затем игра (2).</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="245" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="110" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Menneisyys · past</text>
<text x="270" y="32" font-size="17" font-weight="700" fill="#17232e" text-anchor="middle">Nyt · now</text>
<text x="655" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Tulevaisuus · future</text>
<line x1="40" y1="78" x2="270" y2="78" stroke="#fb4963" stroke-width="5" stroke-linecap="round"/>
<line x1="270" y1="78" x2="760" y2="78" stroke="#ffe64a" stroke-width="5" stroke-linecap="round"/>
<circle cx="270" cy="78" r="9" fill="#ffb43b"/>
<circle cx="475" cy="78" r="7" fill="#159fd2"/>
<text x="475" y="60" font-size="18" font-weight="700" fill="#17232e" text-anchor="middle">1</text>
<circle cx="700" cy="78" r="7" fill="#159fd2"/>
<text x="700" y="60" font-size="18" font-weight="700" fill="#17232e" text-anchor="middle">2</text>
<line x1="475" y1="125" x2="700" y2="125" stroke="#159fd2" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="400" y="183" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Pelaan sinun kanssasi,</text>
<text x="400" y="215" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">kun olen tehnyt kotitehtävät.</text>
</g>
</svg>
