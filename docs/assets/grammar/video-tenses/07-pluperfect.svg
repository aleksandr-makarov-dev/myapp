<svg xmlns="http://www.w3.org/2000/svg" width="800" height="205" viewBox="0 0 800 205" role="img" aria-labelledby="title desc">
<title id="title">Образование perfekti и pluskvamperfekti</title>
<desc id="desc">Вспомогательный глагол меняется с olen на olin. Причастия asunut и syönyt остаются теми же.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="205" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="200" y="45" font-size="24" font-weight="700" fill="#17232e" text-anchor="middle">Perfekti</text>
<text x="600" y="45" font-size="24" font-weight="700" fill="#17232e" text-anchor="middle">Pluskvamperfekti</text>
<text x="200" y="110" text-anchor="middle" font-size="22"><tspan font-weight="700" fill="#159fd2">olen</tspan><tspan fill="#17232e"> asunut</tspan></text>
<text x="600" y="110" text-anchor="middle" font-size="22"><tspan font-weight="700" fill="#fb4963">olin</tspan><tspan fill="#17232e"> asunut</tspan></text>
<text x="200" y="161" text-anchor="middle" font-size="22"><tspan font-weight="700" fill="#159fd2">olen</tspan><tspan fill="#17232e"> syönyt</tspan></text>
<text x="600" y="161" text-anchor="middle" font-size="22"><tspan font-weight="700" fill="#fb4963">olin</tspan><tspan fill="#17232e"> syönyt</tspan></text>
<line x1="345" y1="103" x2="455" y2="103" stroke="#17232e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="345" y1="154" x2="455" y2="154" stroke="#17232e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
</svg>
