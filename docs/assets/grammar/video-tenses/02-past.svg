<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
<title id="title">Imperfekti: событие в прошлом</title>
<desc id="desc">Asuin и en asunut описывают прошлое; событие на шкале находится раньше настоящего.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="245" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="300" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Menneisyys · past</text>
<text x="710" y="32" font-size="17" font-weight="700" fill="#17232e" text-anchor="middle">Nyt · now</text>
<line x1="40" y1="78" x2="710" y2="78" stroke="#fb4963" stroke-width="5" stroke-linecap="round"/>
<line x1="710" y1="78" x2="760" y2="78" stroke="#ffe64a" stroke-width="5" stroke-linecap="round"/>
<circle cx="710" cy="78" r="9" fill="#ffb43b"/>
<circle cx="270" cy="78" r="8" fill="#fb4963"/>
<line x1="270" y1="90" x2="270" y2="144" stroke="#fb4963" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="270" y="133" font-size="19" font-weight="700" fill="#17232e" text-anchor="middle">Imperfekti</text>
<text x="320" y="185" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Asuin Suomessa viime vuonna.</text>
<text x="320" y="220" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">En asunut Suomessa viime vuonna.</text>
</g>
</svg>
