<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
<title id="title">Действие в момент прихода или до него</title>
<desc id="desc">Вертикаль отмечает приход домой. В первой строке собака ест обувь в этот момент; во второй она уже съела обувь раньше.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="320" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="610" y="31" font-size="21" font-weight="700" fill="#17232e" text-anchor="middle">tulin kotiin</text>
<text x="610" y="55" font-size="16" font-weight="400" fill="#17232e" text-anchor="middle">I came home</text>
<line x1="610" y1="70" x2="610" y2="271" stroke="#87939c" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="40" y="87" font-size="18" font-weight="700" fill="#17232e" text-anchor="start">Одновременно</text>
<line x1="180" y1="111" x2="685" y2="111" stroke="#fb4963" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="610" cy="111" r="7" fill="#17232e"/>
<text x="400" y="156" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Koira söi kenkiäni.</text>
<text x="40" y="207" font-size="18" font-weight="700" fill="#17232e" text-anchor="start">Раньше</text>
<line x1="180" y1="232" x2="420" y2="232" stroke="#fb4963" stroke-width="10" stroke-linecap="round"/>
<circle cx="420" cy="232" r="7" fill="#fb4963"/>
<circle cx="610" cy="232" r="7" fill="#17232e"/>
<text x="400" y="285" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Koira oli jo syönyt kenkäni.</text>
</g>
</svg>
