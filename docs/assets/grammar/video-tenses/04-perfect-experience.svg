<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
<title id="title">Perfekti: жизненный опыт</title>
<desc id="desc">Прошлые события рассматриваются как опыт человека к настоящему моменту.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="245" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="300" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Menneisyys · past</text>
<text x="680" y="32" font-size="17" font-weight="700" fill="#17232e" text-anchor="middle">Nyt · now</text>
<line x1="40" y1="78" x2="680" y2="78" stroke="#fb4963" stroke-width="5" stroke-linecap="round"/>
<line x1="680" y1="78" x2="760" y2="78" stroke="#ffe64a" stroke-width="5" stroke-linecap="round"/>
<circle cx="680" cy="78" r="9" fill="#ffb43b"/>
<circle cx="130" cy="78" r="7" fill="#fb4963"/>
<line x1="130" y1="89" x2="130" y2="120" stroke="#fb4963" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<circle cx="300" cy="78" r="7" fill="#fb4963"/>
<line x1="300" y1="89" x2="300" y2="120" stroke="#fb4963" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<circle cx="490" cy="78" r="7" fill="#fb4963"/>
<line x1="490" y1="89" x2="490" y2="120" stroke="#fb4963" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="130" y1="126" x2="680" y2="126" stroke="url(#perfect)" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="410" y="164" font-size="19" font-weight="700" fill="#17232e" text-anchor="middle">Perfekti</text>
<text x="400" y="214" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">Olen käynyt Norjassa.</text>
</g>
