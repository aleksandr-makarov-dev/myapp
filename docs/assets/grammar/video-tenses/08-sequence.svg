<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
<title id="title">Порядок событий в прошлом</title>
<desc id="desc">Первое событие: задания уже выполнены. Второе событие: человек ушёл домой. Оба события предшествуют настоящему.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#17232e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="perfect" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="680" y2="0"><stop offset="0%" stop-color="#fb4963"/><stop offset="100%" stop-color="#159fd2"/></linearGradient>
</defs>
<rect width="800" height="245" rx="10" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17232e">
<text x="300" y="32" font-size="17" font-weight="400" fill="#17232e" text-anchor="middle">Menneisyys · past</text>
<text x="730" y="32" font-size="17" font-weight="700" fill="#17232e" text-anchor="middle">Nyt · now</text>
<line x1="40" y1="78" x2="730" y2="78" stroke="#fb4963" stroke-width="5" stroke-linecap="round"/>
<line x1="730" y1="78" x2="760" y2="78" stroke="#ffe64a" stroke-width="5" stroke-linecap="round"/>
<circle cx="730" cy="78" r="9" fill="#ffb43b"/>
<circle cx="200" cy="78" r="7" fill="#fb4963"/>
<text x="200" y="60" font-size="18" font-weight="700" fill="#17232e" text-anchor="middle">1</text>
<circle cx="510" cy="78" r="7" fill="#fb4963"/>
<text x="510" y="60" font-size="18" font-weight="700" fill="#17232e" text-anchor="middle">2</text>
<line x1="200" y1="125" x2="510" y2="125" stroke="#fb4963" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="210" y="179" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">olin tehnyt tehtävät</text>
<text x="210" y="210" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">loppuun</text>
<text x="530" y="179" font-size="22" font-weight="400" fill="#17232e" text-anchor="middle">lähdin kotiin</text>
</g>
</svg>
